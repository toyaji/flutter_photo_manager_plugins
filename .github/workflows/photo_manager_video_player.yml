name: photo_manager_video_player

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "packages/photo_manager_video_player/**"
      - ".github/workflows/photo_manager_video_player.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/photo_manager_video_player/**"
      - ".github/workflows/photo_manager_video_player.yml"

permissions: {}

env:
  PACKAGE_DIR: packages/photo_manager_video_player

jobs:
  dart:
    name: Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          cache: true
      - name: Test
        working-directory: ${{ env.PACKAGE_DIR }}
        run: flutter test

  android:
    name: Android build + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          cache: true
      - name: Build example (Kotlin)
        working-directory: ${{ env.PACKAGE_DIR }}/example
        run: flutter build apk --debug
      - name: JUnit
        working-directory: ${{ env.PACKAGE_DIR }}/example/android
        run: ./gradlew :photo_manager_video_player:testDebugUnitTest --console=plain

  ios:
    name: iOS build (CocoaPods + SwiftPM) + XCTest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          cache: true
      - name: Build example (CocoaPods)
        working-directory: ${{ env.PACKAGE_DIR }}/example
        run: flutter build ios --simulator --debug --no-codesign
      - name: XCTest
        working-directory: ${{ env.PACKAGE_DIR }}/example/ios
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "id=$UDID" -parallel-testing-enabled NO \
            -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO
      - name: Build example (Swift Package Manager)
        working-directory: ${{ env.PACKAGE_DIR }}/example
        run: |
          flutter config --enable-swift-package-manager
          flutter build ios --simulator --debug --no-codesign
