<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#555"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1a7f37"/></marker>
  </defs>
  <rect width="900" height="560" fill="#fff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#222">썸네일 파이프라인 — 현재(위) vs 설계(아래)</text>

  <!-- 현재 -->
  <text x="20" y="58" font-size="12" font-weight="600" fill="#b00020">현재 (photo_manager)</text>
  <g font-size="11" fill="#222">
    <rect x="20" y="66" width="120" height="44" rx="6" fill="#fde2e2" stroke="#b00020"/><text x="80" y="85" text-anchor="middle">Image 위젯</text><text x="80" y="100" text-anchor="middle">버킷 5종 키</text>
    <path d="M140 88 h28" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="170" y="66" width="130" height="44" rx="6" fill="#fde2e2" stroke="#b00020"/><text x="235" y="85" text-anchor="middle">PHCachingImageManager</text><text x="235" y="100" text-anchor="middle">+ 프리캐시 850장</text>
    <path d="M300 88 h28" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="330" y="66" width="110" height="44" rx="6" fill="#fde2e2" stroke="#b00020"/><text x="385" y="85" text-anchor="middle">UIImage →</text><text x="385" y="100" text-anchor="middle">JPEG 95 인코딩</text>
    <path d="M440 88 h28" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="470" y="66" width="110" height="44" rx="6" fill="#fde2e2" stroke="#b00020"/><text x="525" y="85" text-anchor="middle">채널로</text><text x="525" y="100" text-anchor="middle">바이트 복사</text>
    <path d="M580 88 h28" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="610" y="66" width="110" height="44" rx="6" fill="#fde2e2" stroke="#b00020"/><text x="665" y="85" text-anchor="middle">Dart JPEG</text><text x="665" y="100" text-anchor="middle">디코딩</text>
    <path d="M720 88 h28" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="750" y="66" width="130" height="44" rx="6" fill="#fde2e2" stroke="#b00020"/><text x="815" y="85" text-anchor="middle">ImageCache 100MB</text><text x="815" y="100" text-anchor="middle">경고마다 전량 삭제</text>
  </g>
  <text x="20" y="132" font-size="11" fill="#b00020">핀치 단계마다 키 변경 → 재디코드 · 버킷별 네이티브 캐시 누적 · 프리캐시 resizeMode None → assetsd 사망 → 영구 흰 칸</text>

  <!-- 설계 -->
  <text x="20" y="172" font-size="12" font-weight="600" fill="#1a7f37">설계 (네이티브 픽셀 경로)</text>
  <g font-size="11" fill="#222">
    <rect x="20" y="180" width="130" height="58" rx="6" fill="#e3f4e8" stroke="#1a7f37"/><text x="85" y="199" text-anchor="middle">ZellyThumbnailProvider</text><text x="85" y="214" text-anchor="middle">키 (id, 수정시각, layer)</text><text x="85" y="229" text-anchor="middle">base 128 / main 320</text>
    <path d="M150 209 h28" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ag)"/>
    <rect x="180" y="180" width="120" height="58" rx="6" fill="#e3f4e8" stroke="#1a7f37"/><text x="240" y="199" text-anchor="middle">Pigeon</text><text x="240" y="214" text-anchor="middle">request(id, size)</text><text x="240" y="229" text-anchor="middle">cancel(requestId)</text>
    <path d="M300 209 h28" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ag)"/>
    <rect x="330" y="180" width="170" height="58" rx="6" fill="#e3f4e8" stroke="#1a7f37"/><text x="415" y="199" text-anchor="middle">iOS PHImageManager (sync, 코어×2)</text><text x="415" y="214" text-anchor="middle">Android loadThumbnail / 26~28 폴백</text><text x="415" y="229" text-anchor="middle">→ RGBA malloc 버퍼</text>
    <path d="M500 209 h28" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ag)"/>
    <rect x="530" y="180" width="120" height="58" rx="6" fill="#e3f4e8" stroke="#1a7f37"/><text x="590" y="199" text-anchor="middle">채널: 포인터</text><text x="590" y="214" text-anchor="middle">Int64 4개</text><text x="590" y="229" text-anchor="middle">(바이트 0)</text>
    <path d="M650 209 h28" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ag)"/>
    <rect x="680" y="180" width="200" height="58" rx="6" fill="#e3f4e8" stroke="#1a7f37"/><text x="780" y="199" text-anchor="middle">dart:ffi → ImmutableBuffer(복사 1회)</text><text x="780" y="214" text-anchor="middle">→ malloc.free → ImageDescriptor.raw</text><text x="780" y="229" text-anchor="middle">→ GPU 텍스처</text>
  </g>

  <!-- 하단 규칙 박스 -->
  <g font-size="11" fill="#222">
    <rect x="20" y="262" width="270" height="120" rx="6" fill="#fff4e0" stroke="#e0a030"/>
    <text x="32" y="282" font-weight="600">캐시 (파티션 파사드 1개)</text>
    <text x="32" y="302">base 128: 64MB / 1000장 — 경고에도 유지</text>
    <text x="32" y="320">main 320 + full 1024: 100MB / 250장</text>
    <text x="32" y="338">경고 시 main/full만 clear()</text>
    <text x="32" y="356">네이티브 픽셀 프리캐시: 0</text>
    <text x="32" y="374">2단계: 디스크 128 JPEG q70, 200MB LRU</text>

    <rect x="310" y="262" width="270" height="120" rx="6" fill="#fff4e0" stroke="#e0a030"/>
    <text x="322" y="282" font-weight="600">앞당김·정리</text>
    <text x="322" y="302">cacheExtent 앞뒤 6행이 요청을 앞당김</text>
    <text x="322" y="320">화면 이탈 → 캐시 리스너 식별 후 취소</text>
    <text x="322" y="338">취소 키는 imageCache.evict(key)</text>
    <text x="322" y="356">네이티브: 할당 후 취소 무시, 정확히 1회 응답</text>
    <text x="322" y="374">Dart가 모든 경로에서 free</text>

    <rect x="600" y="262" width="280" height="120" rx="6" fill="#fff4e0" stroke="#e0a030"/>
    <text x="612" y="282" font-weight="600">핀치</text>
    <text x="612" y="302">2·3·4·6열: 키 불변 (main 320 공유)</text>
    <text x="612" y="320">10열: main 레이어만 뗌, base 128 유지</text>
    <text x="612" y="338">셀 = Stack[base 항상, main if !dense]</text>
    <text x="612" y="356">핀치 중 단계 동결, 손 뗀 뒤 1회 전환</text>
    <text x="612" y="374">iCloud: 코드 분류 → 저우선 큐 재요청</text>
  </g>

  <!-- 단계 -->
  <g font-size="11" fill="#222">
    <text x="20" y="412" font-size="12" font-weight="600">단계와 게이트</text>
    <rect x="20" y="422" width="200" height="46" rx="6" fill="#e8f0fe" stroke="#5b8def"/><text x="120" y="441" text-anchor="middle" font-weight="600">0. 결함 수정</text><text x="120" y="458" text-anchor="middle">게이트: assetsd 사망 0</text>
    <path d="M220 445 h20" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="242" y="422" width="200" height="46" rx="6" fill="#e8f0fe" stroke="#5b8def"/><text x="342" y="441" text-anchor="middle" font-weight="600">1. 네이티브 경로 + 2단계 해상도</text><text x="342" y="458" text-anchor="middle">게이트: 흰 칸 0, malloc 잔량 0</text>
    <path d="M442 445 h20" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="464" y="422" width="200" height="46" rx="6" fill="#e8f0fe" stroke="#5b8def"/><text x="564" y="441" text-anchor="middle" font-weight="600">2. 디스크 썸네일 캐시</text><text x="564" y="458" text-anchor="middle">게이트: 콜드 구간 계측</text>
    <path d="M664 445 h20" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="686" y="422" width="194" height="46" rx="6" fill="#e8f0fe" stroke="#5b8def"/><text x="783" y="441" text-anchor="middle" font-weight="600">3. A/B·문서 개정</text><text x="783" y="458" text-anchor="middle">320/256/384, 프리워밍 유무</text>
  </g>

  <g font-size="10" fill="#666">
    <text x="20" y="500">범례: 빨강 = 현재 결함 경로, 초록 = 설계 경로, 주황 = 규칙, 파랑 = 단계</text>
    <text x="20" y="518">근거: Apple AssetGridViewController 샘플, Immich LocalImagesImpl.swift/.kt + image_request.dart, Flutter image_cache.dart dartdoc, 기기 로그 2026-09-06 15:40~15:45</text>
    <text x="20" y="536">검토: flutter-auditor 6회 블라인드 검토(사실 F1~F72) 후 합의</text>
  </g>
</svg>
